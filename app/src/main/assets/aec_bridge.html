<!DOCTYPE html>
<html>
<head><title>AEC Bridge</title></head>
<body>
<!--
  Persistent, bidirectional Kotlin<->JS bridge for Teya's WebView-hosted echo cancellation (see
  WebViewAecHost.kt): push (Kotlin calls onPing via evaluateJavascript) and pull (this page calls
  back into Kotlin's AecBridge interface) — plus the render path (real TTS PCM scheduled gaplessly
  through Web Audio instead of Kotlin's AudioTrack) and the capture path
  (getUserMedia({echoCancellation:true}) streamed back to Kotlin's SileroVad pipeline).
-->
<script>
function log(msg) {
  if (window.AecBridge && window.AecBridge.log) window.AecBridge.log(msg);
  console.log(msg);
}

// Called by Kotlin via evaluateJavascript("onPing('<id>')") — immediately calls back into Kotlin
// so the round trip is: Kotlin pushes -> JS runs -> JS pulls back to Kotlin, all in one measurement.
function onPing(id) {
  if (window.AecBridge && window.AecBridge.onPong) {
    window.AecBridge.onPong(id);
  }
}

// Render path: mirrors the AudioTrack fallback's own streaming write loop, just via Web Audio
// instead. audioCtx is created once at the TTS sample rate (24kHz) on the first chunk, so no
// resampling is needed on either side. Chunks are scheduled back-to-back via nextStartTime (clamped
// to audioCtx.currentTime so a slow-arriving chunk doesn't produce a negative/past start time,
// which AudioBufferSourceNode.start() throws on) — the gap-avoidance any streaming-audio player
// needs.
let audioCtx = null;
let nextStartTime = 0;
let scheduledSources = [];

function ensureAudioCtx(sampleRate) {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
    nextStartTime = audioCtx.currentTime;
  }
  return audioCtx;
}

function base64ToFloat32Array(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}

// Called by Kotlin (WebViewAecHost.pushRenderChunk) once per streamed TTS chunk — schedules it
// immediately after whatever's already queued, never audibly overlapping or gapping as long as
// Kotlin keeps up with the network stream.
function pushRenderChunk(b64, sampleRate) {
  const ctx = ensureAudioCtx(sampleRate);
  const floats = base64ToFloat32Array(b64);
  const buffer = ctx.createBuffer(1, floats.length, sampleRate);
  buffer.copyToChannel(floats, 0);
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  const startAt = Math.max(nextStartTime, ctx.currentTime);
  source.start(startAt);
  scheduledSources.push(source);
  nextStartTime = startAt + buffer.duration;
}

// Polled by Kotlin (WebViewAecHost.awaitRenderPlaybackDone) — the JS-side equivalent of
// AudioTrack.playbackHeadPosition drain-loop polling.
function getPlaybackRemainingMs() {
  if (!audioCtx) return 0;
  return Math.max(0, (nextStartTime - audioCtx.currentTime) * 1000);
}

// Called by Kotlin (WebViewAecHost.stopPlayback) on interrupt — mirrors AudioTrack's
// pause()+flush(). Stops every still-playing/pending scheduled source immediately.
function stopAllPlayback() {
  scheduledSources.forEach((s) => { try { s.stop(); } catch (_) {} });
  scheduledSources = [];
  nextStartTime = audioCtx ? audioCtx.currentTime : 0;
}

// Capture path: getUserMedia's echoCancellation cleans Teya's own voice out of the mic signal,
// then each captured chunk is base64-encoded and pushed back to Kotlin via the AecBridge interface
// (JS->Kotlin pull, same direction as onPing's pong). A muted zero-gain node routes the signal
// through the graph without audibly looping the mic back out.
//
// Buffer size 512 (32ms @ 16kHz, matching SileroVad.FRAME_SIZE exactly) — a larger 2048-sample
// (~128ms) buffer left too few chunks able to land within a single gap-gated listening window
// (only ~2-3 chances vs. ~10 at 512 samples), causing real interrupts to go undetected.
let captureAudioCtx = null;
let captureStream = null;
let captureSource = null;
let captureProcessor = null;

async function startCapture(sampleRate) {
  try {
    captureAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
    await captureAudioCtx.resume();
    captureStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1,
      },
    });
    captureSource = captureAudioCtx.createMediaStreamSource(captureStream);
    captureProcessor = captureAudioCtx.createScriptProcessor(512, 1, 1);
    const mute = captureAudioCtx.createGain();
    mute.gain.value = 0;
    captureProcessor.onaudioprocess = (e) => {
      const data = e.inputBuffer.getChannelData(0);
      const bytes = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const b64 = btoa(binary);
      if (window.AecBridge && window.AecBridge.onCaptureChunk) {
        window.AecBridge.onCaptureChunk(b64);
      }
    };
    captureSource.connect(captureProcessor);
    captureProcessor.connect(mute);
    mute.connect(captureAudioCtx.destination);
    log("Capture started.");
  } catch (e) {
    log(`ERROR starting capture: ${e.message}`);
  }
}

// Called by Kotlin (WebViewAecHost.stopCapture) — mirrors stopAllPlayback's teardown care: release
// the mic track explicitly rather than relying only on the WebView's own destroy() to clean up.
function stopCapture() {
  try { captureProcessor && captureProcessor.disconnect(); } catch (_) {}
  try { captureSource && captureSource.disconnect(); } catch (_) {}
  try { captureStream && captureStream.getTracks().forEach((t) => t.stop()); } catch (_) {}
  try { captureAudioCtx && captureAudioCtx.close(); } catch (_) {}
  captureProcessor = null;
  captureSource = null;
  captureStream = null;
  captureAudioCtx = null;
  log("Capture stopped.");
}

window.addEventListener("load", () => log("AEC bridge page loaded."));
</script>
</body>
</html>
